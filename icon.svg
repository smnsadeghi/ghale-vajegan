<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1a17" />
      <stop offset="100%" stop-color="#0e0c0b" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf9b" />
      <stop offset="50%" stop-color="#c9a25e" />
      <stop offset="100%" stop-color="#7a6348" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Background with Rounded Corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Outer Shield Crest -->
  <path d="M 256 64 C 340 64 416 88 416 128 C 416 288 348 392 256 448 C 164 392 96 288 96 128 C 96 88 172 64 256 64 Z"
        fill="#161311" stroke="url(#goldGrad)" stroke-width="10" stroke-linejoin="round" />

  <!-- Inner Inset Shield -->
  <path d="M 256 86 C 324 86 390 106 390 138 C 390 270 334 366 256 414 C 178 366 122 270 122 138 C 122 106 188 86 256 86 Z"
        fill="#0e0c0b" stroke="#332a23" stroke-width="4" stroke-linejoin="round" />

  <!-- Upward Broadsword in Center -->
  <!-- Blade -->
  <polygon points="256,110 264,300 256,310 248,300" fill="#e8dcc8" opacity="0.9" />
  <line x1="256" y1="110" x2="256" y2="305" stroke="#7a6348" stroke-width="2" />
  <!-- Crossguard -->
  <rect x="224" y="306" width="64" height="10" rx="3" fill="url(#goldGrad)" />
  <!-- Pommel & Grip -->
  <rect x="252" y="316" width="8" height="30" rx="2" fill="#7a6348" />
  <circle cx="256" cy="352" r="8" fill="url(#goldGrad)" />

  <!-- Knight Helm Visor Over Sword Cross -->
  <!-- Helmet Crown -->
  <path d="M 216 170 C 216 140 296 140 296 170 L 302 214 L 210 214 Z" fill="#1e1a17" stroke="url(#goldGrad)" stroke-width="4" />
  <!-- Plume / Comb Crest -->
  <path d="M 256 124 C 252 144 250 156 250 166 L 262 166 C 262 156 260 144 256 124 Z" fill="#a85646" />
  <!-- Visor Plate with Slits -->
  <path d="M 210 214 L 256 248 L 302 214 L 298 266 L 256 288 L 214 266 Z" fill="#161311" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />
  <!-- Horizontal Vision Slits -->
  <line x1="230" y1="228" x2="250" y2="238" stroke="#e8cf9b" stroke-width="4" stroke-linecap="round" />
  <line x1="282" y1="228" x2="262" y2="238" stroke="#e8cf9b" stroke-width="4" stroke-linecap="round" />
  <!-- Breath Holes -->
  <circle cx="244" cy="256" r="3" fill="#c9a25e" />
  <circle cx="256" cy="260" r="3" fill="#c9a25e" />
  <circle cx="268" cy="256" r="3" fill="#c9a25e" />

  <!-- Two Flanking Heraldic Wings / Flourishes -->
  <path d="M 170 178 C 146 220 152 280 186 312 C 166 286 166 236 182 198 Z" fill="url(#goldGrad)" opacity="0.75" />
  <path d="M 342 178 C 366 220 360 280 326 312 C 346 286 346 236 330 198 Z" fill="url(#goldGrad)" opacity="0.75" />

  <!-- Antique Gold Star at Top -->
  <polygon points="256,72 260,82 270,82 262,88 265,98 256,92 247,98 250,88 242,82 252,82" fill="url(#goldGrad)" />
</svg>